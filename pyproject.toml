[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpqmon"
version = "0.0.1"
authors = [
  {name = "Tom Wardill", email = "tom@howrandom.net"}
]
description = "A utility for outputing BPQ monitoring details"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.7",
    "textual>=0.79.0",
    "structlog>=24.4.0",
    "paho-mqtt>=2.1.0",
    "rich>=13.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "black>=24.8.0",
    "textual-dev>=1.6.1",
    "ruff>=0.6.3",
    "coverage>=7.6.1",
]

[project.urls]
Homepage = "https://github.com/tomwardill/bpqmon"
Issues = "https://github.com/tomwardill/bpqmon/issues"

[project.scripts]
bpqmon = "bpqmon.bpqmon:run"

